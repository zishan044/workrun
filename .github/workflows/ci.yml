name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Linux / Go 1.26.3
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.3'

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -timeout=90s ./...

      - name: Race test
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout=120s ./...

      - name: Build
        env:
          WORKRUN_BINARY: ${{ runner.temp }}/workrun
        run: go build -o "$WORKRUN_BINARY" ./cmd/workrun
